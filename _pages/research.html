<h2>Presentation Map</h2>

<div id="presentation-map">

<style>
  #presentation-map { height: 512px; }

    .legend {
    line-height: 15px;
    color: #000000;
    background-color: rgba(240,240,240,0.3);
    padding: 5px;
    box-shadow: 2px 2px 2px grey;
    border-radius: 5px;
}
.legend i {
    width: 13px;
    height: 13px;
    float: left;
    margin-right: 6px;
    opacity: 1;
    border-radius: 50%;
    box-shadow: 1px 1px 1px grey;
}
</style>

<script>

  var map = L.map('presentation-map', {worldCopyJump: true}).setView([20, 20], 2);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 1,
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

<!--icons-->

var LeafIcon = L.Icon.extend({
    options: {
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize:     [25, 41],
        shadowSize:   [41, 41],
        iconAnchor:   [12, 41],
        popupAnchor:  [1, -34]
    }
});


var redIcon = new LeafIcon({iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png'}),
    goldIcon = new LeafIcon({iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png'});


<!--2025-->

var coed2025 = L.marker([51.877364, 0.949875], {icon: redIcon}).addTo(map);
coed2025.bindPopup("14th Conference on Economic Design (2025)");

var sing20 = L.marker([50.847212, 5.685952], {icon: redIcon}).addTo(map);
sing20.bindPopup("European Meeting on Game Theory (2025)");

var otago = L.marker([-45.864979, 170.514615], {icon: goldIcon}).addTo(map);
otago.bindPopup("University of Otago (2025)");

<!--2026-->

var cireq2026 = L.marker([45.495244, -73.578581], {icon: redIcon}).addTo(map);
cireq2026.bindPopup("CIREQ Interdisciplinary PhD Conference in Applied Market Design (2026)");

var fecd2026 = L.marker([48.706615, 2.177096], {icon: redIcon}).addTo(map);
fecd2026.bindPopup("Fair and Explainable Collective Decision (2026)");

var sscw2026 = L.marker([35.711716, 139.763746], {icon: redIcon}).addTo(map);
sscw2026.bindPopup("18th Meeting of the Society for Social Choice and Welfare (2026)");

var cmid2026 = L.marker([53.94539, -1.031459], {icon: redIcon}).addTo(map);
cmid2026.bindPopup("Conference on Mechanism and Institution Design (2026)");

var icgt2026 = L.marker([40.909081, -73.120552], {icon: redIcon}).addTo(map);
icgt2026.bindPopup("37th Stony Brook International Conference on Game Theory (2026)");

var iwgtea2026 = L.marker([-23.561048, -46.725226], {icon: redIcon}).addTo(map);
iwgtea2026.bindPopup("4th International Workshop on Game Theory and Economic Applications (2026)");

<!--legend-->

function getColor(d) {
        return d === 'Conference'  ? "#cb2b3e" :
               "#ffd326" ;
    }

var legend = L.control({position: 'bottomleft'});

legend.onAdd = function (map) {

    var div = L.DomUtil.create('div', 'info legend'),
        labels = [];
        categories = ['Conference','Seminar']

    for (var i = 0; i < categories.length; i++) {
        div.innerHTML +=
            '<i style="background:' + getColor(categories[i]) + '"></i> ' +
            categories[i] + '<br>';
    }

    return div;
};

legend.addTo(map);

</script>

</div>
